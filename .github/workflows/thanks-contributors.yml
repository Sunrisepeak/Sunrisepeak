name: Thanks, Contributors!

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Collect contributors
        uses: Sunrisepeak/thanks-contributors@0.0.7
        with:
            readme_path: README.md
            targets: 'Sunrisepeak/* d2learn/* mcpp-community/* mcpplibs/* openxlings/*'
            sort_pinned: 'Sunrisepeak'
            exclude_logins: 'mcpplibs xlings-ci speak'